[workspace]
members = [
  "crates/protocol",
  "crates/content",
  "crates/sim-core",
  "crates/sim-wasm",
  "crates/server",
  "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
content = { path = "crates/content" }
sim-core = { path = "crates/sim-core" }
wasm-bindgen = "=0.2.129"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rmp-serde = "=1.3.1"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
schemars = "=1.2.3"
jsonschema = { version = "=0.59.0", default-features = false }
# Active in the T03 server; keep the user's networking crate pinned.
net = { git = "https://github.com/harveynw/net-crate", rev = "77b401b1376b5c8bcb98da2884efcb1e63082ba4" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

